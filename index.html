
    <!DOCTYPE html>

    <html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>
            The Silicon Scroll | Weekly Research
        </title>

        <style>

            @import url(
                'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Libre+Baskerville:wght@400;700&display=swap'
            );

            * {
                box-sizing: border-box;
            }

            body {
                background: #f4f1ea;
                color: #1a1a1a;
                font-family: 'Libre Baskerville', serif;
                margin: 0;
                padding: 2vw;
            }

            /* ==============================================
               MASTHEAD
               ============================================== */

            .masthead {
                text-align: center;
                border-bottom: 5px double #333;
                margin-bottom: 40px;
                padding-bottom: 15px;
            }

            .masthead h1 {
                font-family: 'Playfair Display', serif;
                font-size: clamp(3rem, 7vw, 5rem);
                margin: 0;
                letter-spacing: -2px;
            }

            .masthead p {
                font-size: 0.8rem;
                letter-spacing: 1px;
            }

            /* ==============================================
               NEWS DESKS
               ============================================== */

            .news-desk {
                margin-bottom: 50px;
            }

            .desk-title {
                border-bottom: 2px solid #333;
                font-family: 'Playfair Display', serif;
                font-size: 1.8rem;
                margin-bottom: 15px;
                padding-bottom: 5px;

                display: flex;
                justify-content: space-between;
                align-items: center;

                gap: 20px;
            }

            .desk-title span {
                font-size: 0.7rem;
                font-family: 'Libre Baskerville', serif;
                opacity: 0.5;
                white-space: nowrap;
            }

            /* ==============================================
               HORIZONTAL SCROLL
               ============================================== */

            .horizontal-scroll {
                display: flex;
                overflow-x: auto;
                gap: 25px;
                padding: 5px 3px 20px 3px;

                scrollbar-width: thin;
                scrollbar-color: #333 #f4f1ea;
            }

            .horizontal-scroll::-webkit-scrollbar {
                height: 8px;
            }

            .horizontal-scroll::-webkit-scrollbar-track {
                background: #f4f1ea;
            }

            .horizontal-scroll::-webkit-scrollbar-thumb {
                background: #333;
                border-radius: 4px;
            }

            /* ==============================================
               PAPER CARDS
               ============================================== */

            .card {
                flex: 0 0 350px;

                background: #fffefc;

                border: 1px solid #d1cec1;

                padding: 25px;

                box-shadow:
                    4px 4px 0 rgba(0, 0, 0, 0.05);

                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease;

                display: flex;
                flex-direction: column;
            }

            .card:hover {
                transform: translateY(-5px);

                box-shadow:
                    6px 8px 0 rgba(0, 0, 0, 0.08);
            }

            .card-date {
                font-size: 10px;
                font-weight: bold;
                color: #777;
                margin-bottom: 10px;
            }

            h3 {
                font-family: 'Playfair Display', serif;
                font-size: 1.3rem;
                margin: 0 0 10px 0;
                line-height: 1.2;
            }

            h3 a {
                color: #1a1a1a;
                text-decoration: none;
            }

            h3 a:hover {
                text-decoration: underline;
            }

            .meta {
                font-size: 11px;
                font-weight: bold;
                text-transform: uppercase;
                color: #555;
                margin-bottom: 10px;
            }

            .text {
                font-size: 13px;
                line-height: 1.6;
                color: #333;
                flex-grow: 1;
            }

            /* ==============================================
               ORIGINAL DESK COLORS
               ============================================== */

            .ai-accent {
                border-top: 6px solid #2c3e50;
            }

            .nlp-accent {
                border-top: 6px solid #27ae60;
            }

            .vision-accent {
                border-top: 6px solid #e67e22;
            }

            /* ==============================================
               NEW DESK COLORS
               ============================================== */

            .health-accent {
                border-top: 6px solid #c0392b;
            }

            .cyber-accent {
                border-top: 6px solid #6c3483;
            }

            .policy-accent {
                border-top: 6px solid #2471a3;
            }

            /* ==============================================
               MOBILE
               ============================================== */

            @media (max-width: 700px) {

                body {
                    padding: 18px;
                }

                .desk-title {
                    align-items: flex-start;
                    flex-direction: column;
                    gap: 4px;
                }

                .card {
                    flex-basis: 85vw;
                }

            }

        </style>

    </head>

    <body>

    </body>

    </html>
